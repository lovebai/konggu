name: Build and release

on:
  push:
    tags:
      - 'v*'
  # 手动运行只编译并保存构建产物，不发布版本。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: Compile and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          package="inventory-${GOOS}-${GOARCH}"
          binary=inventory
          if [[ "$GOOS" == windows ]]; then binary=inventory.exe; fi
          mkdir -p "dist/$package/licenses" "dist/$package/deploy" artifacts
          go build -trimpath -ldflags='-s -w' -o "dist/$package/$binary" .
          cp config.yaml README.md TESTING.md "dist/$package/"
          cp web/ZXING-LICENSE web/ZXING-CORE-LICENSE "dist/$package/licenses/"
          cp deploy/nginx.conf.example "dist/$package/deploy/"
          if [[ "$GOOS" == windows ]]; then
            cp start.cmd start.ps1 "dist/$package/"
            (cd dist && zip -qr "../artifacts/$package.zip" "$package")
          else
            chmod +x "dist/$package/$binary"
            tar -czf "artifacts/$package.tar.gz" -C dist "$package"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: inventory-*
          path: artifacts
          merge-multiple: true
      - name: Checksums and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '版本标签须为 v1.0.0 或 v1.0.0-rc.1 这样的格式。' >&2
            exit 1
          fi
          cd artifacts
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              echo '该版本已发布，请创建新标签；不会覆盖已发布版本。' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "空谷 $RELEASE_TAG" --generate-notes \
              --prerelease="$prerelease"
          fi
          # 先向草稿上传全部产物，成功后再公开；失败时可重新运行继续上传。
          gh release upload "$RELEASE_TAG" ./*.zip ./*.tar.gz SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
