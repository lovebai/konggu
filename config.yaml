server:
  address: ":8080"
  # 正式上线到 HTTPS 域名后改为 true
  secure_cookie: false
  session_hours: 12
  # 留空时校验 Origin 与请求 Host 一致，反代须保留原始 Host。
  # 若代理必须改写 Host，填写浏览器实际访问地址，例如 ["https://stock.example.com"]。
  # 非空时仅允许列表中的来源；非标准端口也需填写，不支持通配符。
  allowed_origins: []
storage:
  database: "data/inventory.db"
  uploads: "data/uploads"
  max_upload_mb: 8
  # 每条记录最多上传图片数，1–20；省略或为 0 时默认 3。
  max_photos_per_record: 3
audit:
  # 日志保留天数，启动时及每小时自动清理；省略或为 0 时默认 180。
  retention_days: 180
bootstrap:
  admin_username: "admin"
  # 首次启动必须通过 INVENTORY_ADMIN_PASSWORD 环境变量提供至少 12 位密码。
  # 也可填写此项，但不要把真实密码提交到 Git。
  admin_password: ""
